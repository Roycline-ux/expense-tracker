<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Expense Tracker</title>
  <style>
    :root { --bg:#f3f5f9; --card:#fff; --text:#1d2433; --muted:#6b7385; --border:#e6e9f0; --primary:#4f46e5; --danger-bg:#fdecec; --danger:#b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111522; --card:#1a2033; --text:#e8ebf4; --muted:#98a0b5; --border:#2a3148; --primary:#818cf8; --danger-bg:#3a1c1e; --danger:#f0868a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background:var(--bg); color:var(--text); padding:16px; }
    .box { background:var(--card); border:1px solid var(--border); border-radius:14px;
           padding:28px; width:100%; max-width:360px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    h1 { margin:0 0 4px; font-size:1.5rem; text-align:center; }
    p.sub { margin:0 0 20px; color:var(--muted); text-align:center; }
    input { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px;
            background:var(--bg); color:var(--text); font-size:1rem; margin-bottom:12px; }
    button { width:100%; padding:11px; border:none; border-radius:10px; background:var(--primary);
             color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
    .msg { background:var(--danger-bg); color:var(--danger); padding:10px 12px;
           border-radius:10px; margin-bottom:14px; }
    .alt { text-align:center; margin:16px 0 0; color:var(--muted); font-size:.95rem; }
    .alt a { color:var(--primary); font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>💰 Expense Tracker</h1>
    <p class="sub">Please sign in</p>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <input type="text" name="username" placeholder="Username" autofocus required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign in</button>
    </form>
    {% if allow_registration %}
      <p class="alt">No account? <a href="{{ url_for('register') }}">Create one</a></p>
    {% endif %}
  </div>
</body>
</html>
